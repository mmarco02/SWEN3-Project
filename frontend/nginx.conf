server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # REST calls go to the Spring Boot container
    location /api/ {
        proxy_pass http://rest:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # client-side routes (/documents/1, /tags, ...) are handled by the Vue router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
