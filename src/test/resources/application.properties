spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# MinIO is not contacted in tests, the client only needs valid settings
minio.endpoint=http://localhost:9000
minio.access-key=test
minio.secret-key=test-secret
minio.bucket=documents

# RabbitMQ is not contacted in tests (nothing is sent), the names are only needed for the beans
paperless.messaging.exchange=paperless.documents
paperless.messaging.document-uploaded-routing-key=document.uploaded
paperless.messaging.ocr-queue=paperless.ocr
paperless.messaging.ocr-dead-letter-queue=paperless.ocr.dlq
