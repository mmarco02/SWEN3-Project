spring.application.name=paperless
spring.datasource.url=jdbc:postgresql://localhost:5432/mydatabase
spring.datasource.username=myuser
spring.datasource.password=secret
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

minio.endpoint=http://localhost:9000
minio.access-key=paperless
minio.secret-key=paperless-secret
minio.bucket=documents

# RabbitMQ (overridden in Docker by SPRING_RABBITMQ_HOST)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=paperless
spring.rabbitmq.password=paperless-secret
spring.rabbitmq.connection-timeout=5s

# exchange, routing key and queues, the OCR worker uses the same names
paperless.messaging.exchange=paperless.documents
paperless.messaging.document-uploaded-routing-key=document.uploaded
paperless.messaging.ocr-queue=paperless.ocr
paperless.messaging.ocr-dead-letter-queue=paperless.ocr.dlq
