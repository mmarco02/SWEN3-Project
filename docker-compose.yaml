services:
  frontend:
    build: ./frontend
    ports:
      - '80:80'
    depends_on:
      - rest
  rest:
    build: .
    ports:
      - '8080:8080'
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/mydatabase'
      - 'SPRING_ELASTICSEARCH_URIS=http://elasticsearch:9200'
      - 'MINIO_ENDPOINT=http://minio:9000'
    depends_on:
      - postgres
      - elasticsearch
      - minio
    restart: on-failure
  minio:
    # minio/minio is no longer published on Docker Hub, Chainguard builds the same server
    image: 'cgr.dev/chainguard/minio:latest'
    command: ['server', '/data', '--console-address', ':9090']
    environment:
      - 'MINIO_ROOT_USER=paperless'
      - 'MINIO_ROOT_PASSWORD=paperless-secret'
    ports:
      - '9000:9000'
      - '9090:9090'
    volumes:
      - 'minio-data:/data'
  elasticsearch:
    image: 'docker.elastic.co/elasticsearch/elasticsearch:9.3.3'
    environment:
      - 'ELASTIC_PASSWORD=secret'
      - 'discovery.type=single-node'
      - 'xpack.security.enabled=false'
    ports:
      - '9200:9200'
  postgres:
    image: 'postgres:17'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432:5432'

volumes:
  minio-data:
