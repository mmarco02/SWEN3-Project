spring.application.name=ocr-worker

# RabbitMQ (overridden in Docker by SPRING_RABBITMQ_HOST)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=paperless
spring.rabbitmq.password=paperless-secret

# a message that fails is not put back into the queue, RabbitMQ moves it to the dead letter queue
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# must be the same names as in the REST server
paperless.messaging.exchange=paperless.documents
paperless.messaging.document-uploaded-routing-key=document.uploaded
paperless.messaging.ocr-queue=paperless.ocr
paperless.messaging.ocr-dead-letter-queue=paperless.ocr.dlq
